# ebay-sniper configuration. No secrets here: they go in .env.
# Values marked TODO still need a decision from the user.

[search]
marketplaces = ["EBAY_IT", "EBAY_DE", "EBAY_FR", "EBAY_GB", "EBAY_US"]
delivery_country = "IT"
# Used for the X-EBAY-C-ENDUSERCTX header (better shipping estimates).
# TODO: set your own postal code.
buyer_postal_code = "35100"
buying_options = ["FIXED_PRICE", "AUCTION", "BEST_OFFER"]
results_per_query = 100
# eBay keyword syntax: space = AND, (a, b) = OR. Verify OR behaviour in M1.
queries = [
    "futura (spider, spiderweb, spiderwebs, ragno, ragnatela, spinne, spinnennetz, araignee)",
    "(spider, spiderweb, spiderwebs) (watch, quartz)",
    "(orologio, uhr, montre, reloj) (ragnatela, spinnennetz, araignee, arana)",
    "(melting, dali, asymmetrical, asymmetric) watch (spider, web)",
]

[price]
currency = "EUR"
# TODO: maximum total price (item + shipping). Items above it are dropped.
max_total = 400

[rules]
# Dropped when found in title or condition description (case/accent-insensitive).
drop_keywords = [
    "cracked crystal", "broken crystal", "vetro rotto", "vetro crepato",
    "missing hand", "lancetta mancante", "glas gebrochen", "verre casse",
]
# Notified with a warning, not dropped: on a quartz watch often just the battery.
flag_keywords = [
    "not working", "non funzionante", "for parts", "per ricambi",
    "needs battery", "batteria scarica", "defekt", "ne fonctionne pas",
]
# eBay condition 7000 = for parts or not working.
flag_condition_ids = [7000]

[vision]
model = "ViT-B-16-SigLIP"
pretrained = "webli"
positive_dir = "reference_images/positive"
negative_dir = "reference_images/negative"
# TODO: calibrate with the `calibrate` command (M3) instead of guessing.
notify_threshold = 0.0

[telegram]
send_all_photos = true
max_photos = 4

[runtime]
poll_interval_minutes = 20
database_path = "data/ebay_sniper.sqlite3"
image_cache_dir = "data/image_cache"
# Maximum share of the 5,000 daily Browse API calls the config may use.
api_budget_share = 0.6
