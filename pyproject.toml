[project]
name = "ebay-sniper"
version = "0.1.0"
description = "Passive eBay watcher: finds listings of one specific item, filters them by rules and image similarity, and notifies via Telegram. Purchasing stays manual."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.11",
    "pydantic-settings>=2.3",
    # Windows has no system time zone database for zoneinfo.
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
vision = [
    "open-clip-torch>=2.24",
    "pillow>=10.3",
    "torch>=2.3",
    "torchvision>=0.18",
]

[project.scripts]
ebay-sniper = "ebay_sniper.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "respx>=0.21",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ebay_sniper"]

# On Linux, take torch from the CPU-only index to avoid large CUDA wheels.
# Windows and macOS wheels on PyPI are already CPU-only (or MPS on macOS).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error"]
